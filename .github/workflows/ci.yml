name: CI y despliegue en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Compilar aplicación
        run: npm run build
      - name: Ejecutar pruebas unitarias
        run: npm test
      - name: Guardar resultado compilado
        uses: actions/upload-artifact@v7
        with:
          name: sitio-compilado
          path: dist/
          if-no-files-found: error
          retention-days: 7

  preparar_paginas:
    name: Preparar artefacto para Pages
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Recuperar artefacto aprobado
        uses: actions/download-artifact@v8
        with:
          name: sitio-compilado
          path: dist/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar sitio para Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  desplegar:
    name: Desplegar en GitHub Pages
    needs: preparar_paginas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
