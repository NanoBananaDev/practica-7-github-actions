<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de descuentos</title>
    <link rel="stylesheet" href="./estilos.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Práctica 7 · GitHub Actions</p>
      <h1>Calculadora de descuentos</h1>
      <p>Modifica un valor y comprueba el resultado. Cada cambio en el repositorio activa el pipeline.</p>
      <form id="formulario">
        <label>Precio unitario <input id="precio" type="number" min="0" step="0.01" value="60" required /></label>
        <label>Cantidad <input id="cantidad" type="number" min="1" step="1" value="2" required /></label>
        <label>Descuento (%) <input id="descuento" type="number" min="0" max="100" step="0.01" value="10" required /></label>
        <button type="submit">Calcular total</button>
      </form>
      <section aria-live="polite" id="resultado"></section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
